stages:
  - lint
  - test
  - security
  - build
  - release
  - bump

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

default:
  image: python:3.12
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip
      - .cache/uv

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  IMAGE_SHA: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
  IMAGE_BRANCH: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}

# =============================================================================
# Templates
# =============================================================================
.uv-setup:
  before_script:
    - pip install uv
    - uv sync --frozen

.docker-job:
  image: docker:latest
  services:
    - docker:dind
  cache: {}
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# =============================================================================
# Lint
# =============================================================================
lint:
  stage: lint
  extends: .uv-setup
  script:
    - uv run ruff check .
    - uv run ruff format --check .

# =============================================================================
# Test
# =============================================================================
test:
  stage: test
  before_script:
    - apt-get update && apt-get install -y libpango-1.0-0 libharfbuzz0b libcairo2
    - pip install uv
    - uv sync --frozen
  script:
    - uv run python -m pytest --cov --tb=short -q
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always

# =============================================================================
# Security
# =============================================================================
security:
  stage: security
  extends: .uv-setup
  script:
    - uv run bandit -c pyproject.toml -r services/ api/ routes.py app.py config.py

# =============================================================================
# Build — Docker image (main + merge requests)
# =============================================================================
build:
  stage: build
  extends: .docker-job
  script:
    - echo "IMAGE_SHA=$IMAGE_SHA"
    - echo "IMAGE_BRANCH=$IMAGE_BRANCH"
    - docker build -t $IMAGE_SHA -t $IMAGE_BRANCH .
    - docker push $IMAGE_SHA
    - docker push $IMAGE_BRANCH
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Release — versioned image on git tag (v1.2.0)
# =============================================================================
release:
  stage: release
  extends: .docker-job
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG

# =============================================================================
# Bump — pin the new image SHA in the GitOps repo via an auto-merged MR
# =============================================================================
bump:
  stage: bump
  image: alpine:3.20
  cache: {}
  before_script:
    - apk add --no-cache git curl yq
  script:
    - |
      set -euo pipefail
      GITOPS_HOST="gitlab.com"
      GITOPS_PATH="tipunchlabs/homelab-gitops"
      BRANCH="bump/kandidat-${CI_COMMIT_SHORT_SHA}"
      NEW_IMAGE="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"

      git clone "https://oauth2:${HOMELAB_GITOPS_TOKEN}@${GITOPS_HOST}/${GITOPS_PATH}.git" gitops
      cd gitops
      git config user.email "ci@tipunchlabs"
      git config user.name "kandidat-ci"
      git checkout -b "${BRANCH}"

      yq -i ".services.kandidat.image = \"${NEW_IMAGE}\"" kandidat/compose.yaml
      git add kandidat/compose.yaml

      if git diff --cached --quiet; then
        echo "Image already at ${NEW_IMAGE}, nothing to bump."; exit 0
      fi

      git commit -m "chore(kandidat): bump image to ${CI_COMMIT_SHORT_SHA}"
      git push origin "${BRANCH}"

      # Open the MR with auto-remove of the source branch.
      MR=$(curl -sf --request POST \
        --header "PRIVATE-TOKEN: ${HOMELAB_GITOPS_TOKEN}" \
        "${CI_API_V4_URL}/projects/${HOMELAB_GITOPS_PROJECT_ID}/merge_requests" \
        --data "source_branch=${BRANCH}" \
        --data "target_branch=main" \
        --data "remove_source_branch=true" \
        --data "title=chore(kandidat): bump image to ${CI_COMMIT_SHORT_SHA}")
      IID=$(echo "$MR" | yq -p=json '.iid')

      # Merge it (main is MR-only; the token merges via API — no pipeline on the gitops repo).
      curl -sf --request PUT \
        --header "PRIVATE-TOKEN: ${HOMELAB_GITOPS_TOKEN}" \
        "${CI_API_V4_URL}/projects/${HOMELAB_GITOPS_PROJECT_ID}/merge_requests/${IID}/merge" \
        --data "should_remove_source_branch=true"
      echo "Merged MR !${IID} -> kandidat pinned to ${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
