stages:
  - lint
  - test
  - security
  - build
  - release

default:
  image: python:3.12
  tags:
    - homelab
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip
      - .cache/uv

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  IMAGE_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_BRANCH: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

# =============================================================================
# Templates
# =============================================================================
.uv-setup:
  before_script:
    - pip install uv
    - uv sync --frozen

.docker-job:
  tags:
    - homelab
    - docker
  image: docker:latest
  cache: {}
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# =============================================================================
# Lint
# =============================================================================
lint:
  stage: lint
  extends: .uv-setup
  script:
    - uv run ruff check .
    - uv run ruff format --check .

# =============================================================================
# Test
# =============================================================================
test:
  stage: test
  before_script:
    - apt-get update && apt-get install -y libpango-1.0-0 libharfbuzz0b libcairo2
    - pip install uv
    - uv sync --frozen
  script:
    - uv run python -m pytest --cov --tb=short -q
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always

# =============================================================================
# Security
# =============================================================================
security:
  stage: security
  extends: .uv-setup
  script:
    - uv run bandit -c pyproject.toml -r services/ api/ routes.py app.py config.py

# =============================================================================
# Build — Docker image (main + merge requests)
# =============================================================================
build:
  stage: build
  extends: .docker-job
  script:
    - docker build -t $IMAGE_SHA -t $IMAGE_BRANCH .
    - docker push $IMAGE_SHA
    - docker push $IMAGE_BRANCH
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Release — versioned image on git tag (v1.2.0)
# =============================================================================
release:
  stage: release
  extends: .docker-job
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG
