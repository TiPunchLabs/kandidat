<div id="file-list-container">
  {% if c.fichiers %}
  {% for f in c.fichiers %}
  <div class="file-list-item">
    {% if f.type == 'markdown' %}
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);flex-shrink:0">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
    </svg>
    <a href="{{ url_for('main.fichier', slug=c.slug, filename=f.nom) }}">{{ f.nom }}</a>
    {% else %}
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-tertiary);flex-shrink:0">
      <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/>
    </svg>
    <span>{{ f.nom }}</span>
    <span class="file-type">{{ f.type }}</span>
    <a href="{{ url_for('main.fichier_download', slug=c.slug, filename=f.nom) }}" class="btn-download" title="Telecharger {{ f.nom }}" aria-label="Telecharger {{ f.nom }}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </a>
    {% endif %}
    <div class="file-actions">
      <form method="post" action="{{ url_for('main.fichier_delete', slug=c.slug, filename=f.nom) }}"
            style="margin:0" class="file-delete-form" data-nom="{{ f.nom }}"
            hx-post="{{ url_for('main.fichier_delete', slug=c.slug, filename=f.nom) }}"
            hx-target="#file-list-container"
            hx-swap="outerHTML"
            hx-disabled-elt="find button[type='submit']">
        <button type="submit" class="btn-delete-file" title="Supprimer {{ f.nom }}" aria-label="Supprimer {{ f.nom }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </form>
    </div>
  </div>
  {% endfor %}
  {% else %}
  <p style="color:var(--text-tertiary);font-size:0.82rem;margin:0">Aucun fichier associe.</p>
  {% endif %}

  <form method="post" action="{{ url_for('main.upload', slug=c.slug) }}" enctype="multipart/form-data"
        class="file-upload-form"
        hx-post="{{ url_for('main.upload', slug=c.slug) }}"
        hx-target="#file-list-container"
        hx-swap="outerHTML"
        hx-encoding="multipart/form-data"
        hx-disabled-elt="find button[type='submit']">
    <label for="file-upload" class="sr-only">Ajouter un fichier</label>
    <input type="file" name="file" id="file-upload" required class="form-control form-control-sm">
    <button type="submit" class="btn btn-primary btn-sm">Ajouter</button>
  </form>
</div>
